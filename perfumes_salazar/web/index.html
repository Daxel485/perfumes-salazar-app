<!DOCTYPE html>
<html lang="es-CR">
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    Alternatively, build your application passing the --base-href parameter
    specifying the new root path of your web app.

    Fore more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">

  <!-- iOS meta tags & icons -->
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="Perfumes Salazar">

  

  <meta name="robots" content="noindex" />

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png" />

  <!-- Open Graph & SEO tags -->
  <meta property="og:title" content="Perfumes Salazar" />
  <meta property="og:description" content="Explora el catálogo de fragancias de Perfumes Salazar, consulta existencias y da seguimiento a tus pedidos." />

  <meta name="twitter:title" content="Perfumes Salazar" />
  <meta name="twitter:description" content="Explora el catálogo de fragancias de Perfumes Salazar, consulta existencias y da seguimiento a tus pedidos." />

  <meta name="twitter:card" content="summary" />

  <title>Perfumes Salazar</title>
  <meta name="description" content="Explora el catálogo de fragancias de Perfumes Salazar, consulta existencias y da seguimiento a tus pedidos." />
    

  <!-- Status Bar color in Safari browser (iOS) and PWA -->
  <meta name="theme-color" media="(prefers-color-scheme: light)" content="#211b17">
  <meta name="theme-color" media="(prefers-color-scheme: dark)"  content="#211b17">

  <link rel="manifest" href="manifest.json">
  
</head>
